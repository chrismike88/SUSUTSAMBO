  --ink:#0C1E24; --ink-2:#42606A; --ink-3:#6E8A93;

  --petrol:#0B3B45; --petrol-2:#12525E; --on-petrol:#EAF3F4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --grid:#DEE7E9; --axis:#BECDD1;

}

  --petrol:#071F25; --petrol-2:#0F4A55; --on-petrol:#DCEDEF;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --grid:#17333B; --axis:#28535E;
  --ok-w:#0C2A18; --warn-w:#2E2508; --late-w:#2E1810; --bad-w:#2E1213;
  --seq1:#104281; --seq2:#184f95; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;
  --sh:0 1px 2px rgba(0,0,0,.35),0 10px 26px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#061418; --surface:#0D262D; --surface-2:#123039; --sunk:#0A1F25;
  --ink:#E7F1F3; --ink-2:#A6C0C7; --ink-3:#7A99A2;
  --line:#1B3A43; --line-2:#28535E;
  --petrol:#071F25; --petrol-2:#0F4A55; --on-petrol:#DCEDEF;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --grid:#17333B; --axis:#28535E;
  --ok-w:#0C2A18; --warn-w:#2E2508; --late-w:#2E1810; --bad-w:#2E1213;
  --seq1:#104281; --seq2:#184f95; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4;

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;
  margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Masthead ─────────────────────────────────────────────────────────── */
.mast{background:var(--petrol);color:var(--on-petrol)}
.mast-in{max-width:1280px;margin:0 auto;padding:14px 20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.logo{display:flex;align-items:baseline;gap:9px;min-width:0}
.logo b{font-family:Archivo;font-weight:700;font-size:19px;letter-spacing:.03em}
.logo span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-petrol);opacity:.6}
.mast dl{display:flex;gap:22px;margin:0 0 0 auto;flex-wrap:wrap}
.mast dt{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.55;
  font-family:"IBM Plex Mono",monospace}
.mast dd{margin:1px 0 0;font-size:12.5px;font-weight:500}
.tema{background:none;border:1px solid rgba(255,255,255,.22);color:inherit;
  border-radius:6px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer}
.tema:hover{background:rgba(255,255,255,.1)}

/* ── Wrapper ──────────────────────────────────────────────────────────── */
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 56px}

/* ── Strip putusan ────────────────────────────────────────────────────── */
.verdict{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);
  border-left:5px solid var(--warn)}
.verdict .tag{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:5px;
  background:var(--warn-w);color:#8A5A00;white-space:nowrap}
:root[data-theme="dark"] .verdict .tag,
:root:not([data-theme="light"]) .verdict .tag{color:var(--warn)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .verdict .tag{color:#8A5A00}}
.verdict p{margin:0;font-size:13.5px}
.verdict strong{font-weight:600}

/* ── Rel KPI ──────────────────────────────────────────────────────────── */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.tile .lab{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.tile .val{font-family:Archivo;font-weight:700;font-size:31px;line-height:1.08;letter-spacing:-.02em}
.tile .val em{font-style:normal;font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px}
.tile .sub{font-size:11.5px;color:var(--ink-2);line-height:1.4}

/* ── Tab ──────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:20px 0 0;
  border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 13px;font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);
  cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s2);font-weight:600}
.panel{padding-top:18px}
.panel[hidden]{display:none!important}

/* ── Kartu ────────────────────────────────────────────────────────────── */
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:1fr}
@media(min-width:900px){.g2{grid-template-columns:1.55fr 1fr}.g2.even{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:15px 16px 16px;box-shadow:var(--sh);min-width:0}
.card>header{margin-bottom:12px}
.card h2{font-size:14.5px;font-weight:600}
.card .hint{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.45}

/* ── Baris berstrip status ────────────────────────────────────────────── */
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  padding:8px 10px 8px 0;border-radius:7px;background:var(--surface-2);
  border-left:4px solid var(--line-2)}
.row.ok{border-left-color:var(--ok)} .row.warn{border-left-color:var(--warn)}
.row.late{border-left-color:var(--late)} .row.bad{border-left-color:var(--bad)}
.row .kode{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-2);padding-left:10px;white-space:nowrap}
.row .nm{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .met{display:flex;align-items:center;gap:9px;white-space:nowrap}
.bar{width:74px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:3px}
.pct{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Lencana ──────────────────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;
  white-space:nowrap}
.chip.ok{background:var(--ok-w);color:var(--ok)} .chip.warn{background:var(--warn-w);color:#8A5A00}
.chip.late{background:var(--late-w);color:#9A431C} .chip.bad{background:var(--bad-w);color:var(--bad)}
:root[data-theme="dark"] .chip.warn,:root[data-theme="dark"] .chip.late{color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.warn{color:var(--warn)}
  :root:not([data-theme="light"]) .chip.late{color:var(--late)}}

/* ── Tabel ────────────────────────────────────────────────────────────── */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.heat{display:inline-block;padding:2px 7px;border-radius:5px;font-weight:600;
  font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:11.5px}

/* ── Grafik ───────────────────────────────────────────────────────────── */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart text{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-3)}
.chart text.emph{fill:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:5px 15px;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;
  vertical-align:middle}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink-3) 0 4px,transparent 4px 7px)}

/* ── Aksi ─────────────────────────────────────────────────────────────── */
.aksi{display:flex;flex-direction:column;gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
  box-shadow:var(--sh);border-left:5px solid var(--line-2)}
.act.p1{border-left-color:var(--bad)} .act.p2{border-left-color:var(--late)}
.act.p3{border-left-color:var(--warn)} .act.p4{border-left-color:var(--ink-3)}
.act .hd{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:6px}
.act h3{font-size:13.5px;font-weight:600;line-height:1.4}
.act .why{margin:5px 0 0;font-size:12px;color:var(--ink-2)}
.act .why b{color:var(--ink);font-weight:600}
.act dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;
  margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.act dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.act dd{margin:2px 0 0;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* ── Simulator ────────────────────────────────────────────────────────── */
.sim{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.sim{grid-template-columns:320px 1fr}}
.slider{margin-bottom:17px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slider label{font-size:12.5px;font-weight:500}
.slider output{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--s1)}
.slider input{width:100%;margin:7px 0 0;accent-color:var(--s1);height:4px}
.slider .h{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.sc{border:1px solid var(--line);border-radius:10px;padding:14px 15px;background:var(--surface);
  box-shadow:var(--sh);border-left:5px solid var(--line-2)}
.sc.pass{border-left-color:var(--ok)} .sc.fail{border-left-color:var(--bad)}
.sc .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.sc h3{font-size:13px;font-weight:600}
.sc .big{font-family:Archivo;font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 2px}
.sc .cap{font-size:11.5px;color:var(--ink-3)}
.sc dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:11px 0 0;padding-top:10px;
  border-top:1px solid var(--line);font-size:11.5px}
.sc dt{color:var(--ink-3)} .sc dd{margin:0;text-align:right;font-weight:600;
  font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
.sc p.note{margin:10px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.5}

.foot{margin-top:22px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);font-size:11.5px;color:var(--ink-2);line-height:1.55}
.foot b{color:var(--ink)}
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const nf = (a,b)=>new Intl.NumberFormat('id-ID',{minimumFractionDigits:a,maximumFractionDigits:b});
const N  = (v,d=0)=> v==null||isNaN(v) ? '–' : nf(d,d).format(v);
const P  = (v,d=2)=> v==null||isNaN(v) ? '–' : nf(d,d).format(v)+'%';
const PP = (v,d=2)=> v==null ? '–' : (v>0?'+':v<0?'−':'')+nf(d,d).format(Math.abs(v))+' pp';
function Rp(v){ const a=Math.abs(v);
  if(a>=1e12) return 'Rp '+N(v/1e12,2)+' T'; if(a>=1e9) return 'Rp '+N(v/1e9,2)+' M';
  if(a>=1e6) return 'Rp '+N(v/1e6,1)+' jt'; if(a>=1e3) return 'Rp '+N(v/1e3,0)+' rb';
  return 'Rp '+N(v); }
function KW(v){ const a=Math.abs(v);
  if(a>=1e6) return N(v/1e6,2)+' juta'; if(a>=1e3) return N(v/1e3,1)+' ribu'; return N(v); }
const K = D.kpi, A = K.skenario_a_kumulatif, B = K.skenario_b_exit_rate;

].map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('');

const cukup = K.kwh_selamat_sisa >= A.gap_kwh_harus_diselamatkan;

/* ── Grafik garis: tren susut ─────────────────────────────────────────── */
function chartTren(){
  const W=660,H=248,L=42,R=14,T=14,Bo=26, iw=W-L-R, ih=H-T-Bo;
  const d=D.neraca, vals=d.flatMap(n=>[n.sp,n.tp,n.yt]).filter(v=>v!=null).concat([K.target_akhir_tahun_persen]);
  const lo=Math.floor((Math.min(...vals)-.3)*2)/2, hi=Math.ceil((Math.max(...vals)+.3)*2)/2;
  const X=i=>L+iw*i/(d.length-1), Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  let g='',tick='';
  const steps=5;
  for(let i=0;i<=steps;i++){ const v=lo+(hi-lo)*i/steps, y=Y(v);
    g+=`<line class="gridline" x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}"/>`;
    tick+=`<text x="${L-7}" y="${(y+3.3).toFixed(1)}" text-anchor="end">${N(v,1)}%</text>`; }
  d.forEach((n,i)=>{ tick+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle"${n.s==='P'?' opacity=".55"':''}>${n.b}</text>`; });
  const path=(key,filt)=>{ let p='',on=false;
    d.forEach((n,i)=>{ const v=n[key]; if(v==null||(filt&&!filt(n))){on=false;return;}
      p+=(on?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; on=true; }); return p.trim(); };
  const dots=d.map((n,i)=>n.sp!=null&&n.s==='R'
    ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(n.sp).toFixed(1)}" r="3.1" fill="var(--s1)"/>`:'').join('');
  const ty=Y(K.target_akhir_tahun_persen);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Tren susut bulanan terhadap target, Januari sampai Desember">
    ${g}<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${T+ih}"/>
    <line class="axis" x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}"/>
    <line x1="${L}" y1="${ty.toFixed(1)}" x2="${W-R}" y2="${ty.toFixed(1)}"
      stroke="var(--s3)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="emph" x="${L+7}" y="${(ty-7).toFixed(1)}" text-anchor="start" fill="var(--s3)"
      >Target akhir tahun ${P(K.target_akhir_tahun_persen)}</text>
    <path d="${path('tp')}" fill="none" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="${path('yt')}" fill="none" stroke="var(--s2)" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="${path('sp',n=>n.s==='R')}" fill="none" stroke="var(--s1)" stroke-width="2.1" stroke-linejoin="round"/>
    ${dots}${tick}</svg>
  <div class="legend"><span><i style="background:var(--s1)"></i>Susut bulanan (realisasi)</span>
    <span><i style="background:var(--s2)"></i>Susut kumulatif (YTD)</span>
    <span><i class="dash"></i>Target bulanan</span></div>`;
}

/* ── Grafik batang bulanan ────────────────────────────────────────────── */
function chartKolom(rows,warna,fmtY,fmtV,label){
  const W=560,H=210,L=52,R=10,T=12,Bo=26, iw=W-L-R, ih=H-T-Bo;
  const max=Math.max(...rows.map(r=>r.v))*1.1;
  const bw=iw/rows.length*0.56;
  let g='',tick='',bars='';
  for(let i=0;i<=4;i++){ const v=max*i/4, y=T+ih-ih*i/4;
    g+=`<line class="gridline" x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}"/>`;
    tick+=`<text x="${L-7}" y="${(y+3.3).toFixed(1)}" text-anchor="end">${fmtY(v)}</text>`; }
  rows.forEach((r,i)=>{ const cx=L+iw*(i+.5)/rows.length, h=Math.max(1,r.v/max*ih);
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="3" fill="${warna}"><title>${esc(r.b)}: ${fmtV(r.v)}</title></rect>`;
    tick+=`<text x="${cx.toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(r.b)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${g}<line class="axis" x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}"/>${bars}${tick}</svg>`;
}
function chartGaris(rows,warna,label){
  const W=560,H=210,L=46,R=12,T=12,Bo=26, iw=W-L-R, ih=H-T-Bo;
  const X=i=>L+iw*(rows.length===1?.5:i/(rows.length-1)), Y=v=>T+ih-v/100*ih;
  let g='',tick='';
  for(let i=0;i<=4;i++){ const v=100*i/4, y=Y(v);
    g+=`<line class="gridline" x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}"/>`;
    tick+=`<text x="${L-7}" y="${(y+3.3).toFixed(1)}" text-anchor="end">${N(v)}%</text>`; }
  let p='';
  rows.forEach((r,i)=>{ p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(r.v).toFixed(1)+' ';
    tick+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${esc(r.b)}</text>`; });
  const dots=rows.map((r,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(r.v).toFixed(1)}" r="3.1"
    fill="${warna}"><title>${esc(r.b)}: ${P(r.v,1)}</title></circle>`).join('');
  const last=rows[rows.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    ${g}<line class="axis" x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}"/>
    <path d="${p.trim()}" fill="none" stroke="${warna}" stroke-width="2.1" stroke-linejoin="round"/>
    ${dots}<text class="emph" x="${X(rows.length-1).toFixed(1)}" y="${(Y(last.v)-9).toFixed(1)}"
      text-anchor="end" fill="${warna}">${P(last.v,1)}</text>${tick}</svg>`;
}

    ${chartGaris(D.p2tl.map(m=>({b:m.b,v:m.tg?m.by/m.tg*100:0})),'var(--s2)',
      'Efektivitas penagihan per bulan dalam persen')}</div>
</div>
<div class="grid g2 even" style="margin-top:14px">
  <div class="card"><header><h2>Temuan menurut golongan pelanggaran</h2>
    <p class="hint">Golongan menentukan rumus tagihan susulan dan cara penindakannya.</p></header>
    <div class="scroll"><table><thead><tr><th>Gol.</th><th>Uraian</th><th class="r">Temuan</th>
      <th class="r">kWh</th><th class="r">Porsi</th><th class="r">Tagihan susulan</th></tr></thead><tbody>
    ${[...D.gol].sort((a,b)=>b.kwh-a.kwh).map(g=>`<tr>
      <td class="mono" style="font-weight:600">${esc(g.g)}</td>
      <td style="color:var(--ink-2)">${esc(g.ket)}</td><td class="r num">${N(g.tm)}</td>
      <td class="r num">${N(g.kwh)}</td><td class="r num">${P(g.kwh/totKwhGol*100,1)}</td>
      <td class="r num">${Rp(g.rp)}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card"><header><h2>Capaian program non-teknis</h2>
    <p class="hint">Dua belas item yang menyerang penyebab susut non-teknis.</p></header>
    ${rowsHTML([...D.prog].filter(p=>p.kat==='NON_TEKNIS').sort((a,b)=>a.cp-b.cp).map(p=>({
      kode:p.k,judul:p.n,cls:KLS[p.s],chip:null,pct:Math.min(100,p.cp),
      warna:warnaStatus(KLS[p.s]),nilai:N(p.cp,1)+'%'})))}
    <p class="hint" style="margin-top:11px"><b>Prioritas ada di sini.</b> Sisa potensi non-teknis
      ${KW(K.kontribusi_nonteknis.kwh_sisa)} kWh — jauh melampaui teknis
      ${KW(K.kontribusi_teknis.kwh_sisa)} kWh — dan umumnya lebih cepat berbuah karena tidak
      menunggu pengadaan material jaringan.</p></div>
</div>`;

/* ── Tab 5 · Rencana aksi ────────────────────────────────────────────── */
const PR={'SANGAT TINGGI':'p1',TINGGI:'p2',SEDANG:'p3',RUTIN:'p4'};
const PRC={'SANGAT TINGGI':'bad',TINGGI:'late',SEDANG:'warn',RUTIN:'ok'};
document.getElementById('p-aksi').innerHTML = `
<div class="card" style="margin-bottom:14px"><header><h2>Cara memakai halaman ini dalam rapat mingguan</h2>
  <p class="hint">Bahas hanya prioritas SANGAT TINGGI dan yang berstatus TERLAMBAT — biasanya lima
    sampai enam baris. Tiga pertanyaan per baris: berapa yang selesai minggu ini, apa penghambatnya
    (material, regu, izin, atau anggaran), dan apakah kebutuhan per bulan masih masuk akal. Kalau
    sudah tidak masuk akal, keputusannya menambah sumber daya atau merevisi target — bukan menambah imbauan.</p></header></div>
<div class="aksi">
${D.aksi.map(a=>`<article class="act ${PR[a.pr]||'p4'}">
  <div class="hd"><span class="chip ${PRC[a.pr]||'ok'}">${esc(a.pr)}</span>
    <span class="chip" style="background:var(--surface-2);color:var(--ink-2)"
      >${a.kat==='TEKNIS'?'Teknis':'Non-teknis'} · ${esc(a.pk)}</span>
    <span class="chip ${a.s==='TERLAMBAT'?'bad':a.s==='TERCAPAI'?'ok':'warn'}">${esc(a.s)}</span></div>
  <h3>${esc(a.a)}</h3>
  <p class="why"><b>Akar masalah:</b> ${esc(a.am)}</p>
  <dl>${[['Dampak kWh/bulan',a.dk>0?N(a.dk):'finansial'],
         ['Dampak s/d Desember',a.ds>0?KW(a.ds)+' kWh':'—'],
         ['Nilai',a.ds>0?Rp(a.ds*TARIF):'—'],
         ['Penanggung jawab',a.pic.replace('Supervisor ','SPV ')],
         ['Target selesai',a.ts],['Progres',N(a.pg,0)+'%']]
    .map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
  <div class="bar" style="width:100%;margin-top:10px"><i style="width:${Math.min(100,a.pg)}%;
    background:${a.pg>=100?'var(--ok)':a.s==='TERLAMBAT'?'var(--bad)':'var(--s1)'}"></i></div>
</article>`).join('')}</div>`;

/* ── Tab 6 · Simulasi ────────────────────────────────────────────────── */
const SAL_SISA=88017440, SAL_DES=22480310, BULAN_SISA=K.bulan_tersisa;
document.getElementById('p-simulasi').innerHTML = `
<div class="sim">
  <div class="card"><header><h2>Asumsi</h2>
    <p class="hint">Geser untuk menguji kemungkinan. Hasil di kanan berubah seketika.</p></header>
    <div id="sliders"></div>
    <button class="tema" id="reset" type="button"
      style="width:100%;border-color:var(--line-2);color:var(--ink-2);margin-top:4px">
      Kembalikan ke asumsi awal</button></div>
  <div style="display:flex;flex-direction:column;gap:14px" id="hasil"></div>
</div>
<div class="card" style="margin-top:14px"><header><h2>Mengapa ada dua tafsir</h2></header>
  <div class="scroll"><table><thead><tr><th>Aspek</th>
    <th>Skenario A — susut kumulatif (YTD)</th><th>Skenario B — susut Desember (exit rate)</th>
    </tr></thead><tbody>
  ${[['Cara menghitung','Seluruh kWh susut setahun ÷ seluruh kWh salur setahun',
      'kWh susut bulan Desember ÷ kWh salur bulan Desember'],
     ['Beban bulan-bulan awal','Ikut terhitung dan tidak bisa dihapus','Tidak berpengaruh'],
     ['Susut yang harus dicapai Sep–Des',P(A.susut_sisa_diizinkan_persen),
      P(K.target_akhir_tahun_persen)+' pada bulan Desember saja'],
     ['Gap kWh',N(A.gap_kwh_harus_diselamatkan),N(B.gap_kwh_harus_diselamatkan)],
     ['Tingkat kesulitan',A.tingkat_kesulitan,B.tingkat_kesulitan]]
    .map(r=>`<tr><td style="font-weight:600">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="hint" style="margin-top:11px"><b>Pastikan lebih dulu ke UP3 tafsir mana yang dipakai
    menilai unit</b> sebelum menyusun rencana kerja semester dua — keduanya menuntut kecepatan
    kerja yang sangat berbeda.</p></div>`;

const AWAL={target:K.target_akhir_tahun_persen,eks:100,dasar:K.susut_bulan_ini_persen,beban:100};
let S={...AWAL};
const SPEC=[
  ['target','Target susut akhir tahun',4.5,7.5,.05,v=>P(v),`Nilai RKAP saat ini ${P(AWAL.target)}`],
  ['eks','Tingkat eksekusi sisa work plan',0,100,5,v=>N(v)+'%',
    `100% berarti seluruh sisa target ${KW(K.kwh_selamat_sisa)} kWh tuntas sampai Desember`],
  ['dasar','Susut dasar tanpa aksi tambahan',4,8,.01,v=>P(v),
    `Bawaan memakai realisasi bulan terakhir ${P(AWAL.dasar)}`],
  ['beban','Proyeksi beban Sep–Des',85,125,1,v=>N(v)+'%',
    'Naikkan bila pertumbuhan beban melebihi rencana']];
document.getElementById('sliders').innerHTML = SPEC.map(([k,l,mn,mx,st])=>`
  <div class="slider"><div class="top"><label for="s-${k}">${l}</label>
    <output id="o-${k}"></output></div>
    <input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${st}">
    <p class="h" id="h-${k}"></p></div>`).join('');

function hitung(){
  const salurSisa=SAL_SISA*S.beban/100, salurDes=SAL_DES*S.beban/100;
  const salurThn=K.kwh_salur_ytd+salurSisa, hemat=K.kwh_selamat_sisa*S.eks/100;
  const tanpaAksi=salurSisa*S.dasar/100, denganAksi=Math.max(tanpaAksi-hemat,0);
  const maks=salurThn*S.target/100, izin=maks-K.kwh_susut_ytd;
  const proyA=(K.kwh_susut_ytd+denganAksi)/salurThn*100;
  const hematBln=hemat/BULAN_SISA;
  const desTanpa=salurDes*S.dasar/100, desDengan=Math.max(desTanpa-hematBln,0);
  const proyB=desDengan/salurDes*100;
  return {salurSisa,salurDes,hemat,hematBln,izin,izinPct:izin/salurSisa*100,
    gapA:tanpaAksi-izin, gapB:desTanpa-salurDes*S.target/100, proyA, proyB,
    okA:proyA<=S.target, okB:proyB<=S.target};
}
function kotak(judul,proy,ok,baris,nota){
  return `<div class="sc ${ok?'pass':'fail'}"><div class="top"><h3>${judul}</h3>
    <span class="chip ${ok?'ok':'bad'}">${ok?'TARGET TERCAPAI':'TARGET TIDAK TERCAPAI'}</span></div>
    <p class="big" style="color:${ok?'var(--ok)':'var(--bad)'}">${P(proy)}</p>
    <p class="cap">proyeksi dengan asumsi di sebelah kiri · target ${P(S.target)}</p>
    <dl>${baris.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    <p class="note">${nota}</p></div>`;
}
function render(){
  SPEC.forEach(([k,,,,,fmt,hint])=>{ const i=document.getElementById('s-'+k);
    i.value=S[k]; document.getElementById('o-'+k).textContent=fmt(S[k]);
    document.getElementById('h-'+k).textContent=hint; });
  const h=hitung();
  document.getElementById('hasil').innerHTML =
    kotak('Skenario A — target dibaca sebagai susut kumulatif (YTD)',h.proyA,h.okA,
      [['kWh susut masih boleh terjadi Sep–Des',N(Math.round(h.izin))],
       ['Setara susut Sep–Des maksimum',P(h.izinPct)],
       ['Gap bila tanpa aksi tambahan',N(Math.round(Math.max(h.gapA,0)))],
       ['Nilai finansial gap',Rp(Math.max(h.gapA,0)*TARIF)],
       ['kWh diselamatkan dari eksekusi',N(Math.round(h.hemat))]],
      'Tafsir yang lazim dipakai menilai kinerja RKAP, dan yang paling berat: satu bulan buruk di awal tahun ikut menyeret angka kumulatif sampai Desember.') +
    kotak('Skenario B — target dibaca sebagai susut bulan Desember',h.proyB,h.okB,
      [['Penurunan dibutuhkan dari bulan terakhir',N(S.dasar-S.target,2)+' pp'],
       ['kWh susut maksimum di Desember',N(Math.round(h.salurDes*S.target/100))],
       ['Penghematan bulanan dari eksekusi',N(Math.round(h.hematBln))],
       ['Gap bila tanpa aksi tambahan',N(Math.round(Math.max(h.gapB,0)))],
       ['Nilai finansial gap',Rp(Math.max(h.gapB,0)*TARIF)]],
      'Menilai kondisi akhir jaringan, bukan rata-rata setahun. Lebih ringan dicapai, dan lebih jujur menggambarkan hasil kerja semester dua.');
}
SPEC.forEach(([k])=>document.getElementById('s-'+k)
  .addEventListener('input',e=>{S[k]=+e.target.value;render();}));
document.getElementById('reset').addEventListener('click',()=>{S={...AWAL};render();});
render();

/* ── Tab & tema ──────────────────────────────────────────────────────── */
const TAB=[['ringkas','Ringkasan'],['plan','Work Plan'],['teknis','Susut Teknis'],
  ['nonteknis','Susut Non-Teknis'],['aksi','Rencana Aksi'],['simulasi','Simulasi Target']];
document.getElementById('tabs').innerHTML = TAB.map(([id,l],i)=>
  `<button role="tab" data-t="${id}" aria-selected="${i===0}"
    aria-controls="p-${id}">${l}</button>`).join('');
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-t]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  TAB.forEach(([id])=>document.getElementById('p-'+id).hidden = id!==b.dataset.t);
});
const root=document.documentElement;
try{ const t=localStorage.getItem('susutsambo-tema'); if(t) root.dataset.theme=t; }catch(e){}
document.getElementById('tema').addEventListener('click',()=>{
  const gelap = root.dataset.theme ? root.dataset.theme==='dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = gelap ? 'light' : 'dark';
  try{ localStorage.setItem('susutsambo-tema', root.dataset.theme); }catch(e){}
});
</script>
